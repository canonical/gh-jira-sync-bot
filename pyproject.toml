[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "github_jira_sync_app"
authors = [{name = "Maksim Beliaev", email = "beliaev.m.s@gmail.com"}]
license = {file = "LICENSE"}
classifiers = ["License :: OSI Approved :: Apache Software License"]
description = "FastAPI server to serve GitHub bot that synchronizes issues from GitHub to Jira"
dynamic = ["version", "dependencies"]

# development dependencies
[project.optional-dependencies]
test = [
    "pre-commit",
    "pytest",
    "coverage >= 6.0.0",
    "pytest-cov",
    "mypy",
    "types-PyYAML",
    "httpx",
    "tox",
    "responses"
]

deploy = [
    "build",
]

[tool.mypy]
exclude = "tests"

[tool.setuptools.dynamic]
version = {attr = "github_jira_sync_app.__version__"}
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["github_jira_sync_app*"]

[tool.setuptools.package-data]
github_jira_sync_app = ["settings.yaml"]
